<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">inprop logo</title>
  <desc id="desc">Navy house icon with a red person symbol, the inprop wordmark, and the tagline Rent, Buy, Jobs.</desc>
  <defs>
    <style>
      .navy { fill: #102C5C; }
      .red { fill: #F32635; }
      .wordmark { font-family: Montserrat, Poppins, Arial, sans-serif; font-size: 238px; font-weight: 800; letter-spacing: -11px; }
      .tagline { font-family: Montserrat, Poppins, Arial, sans-serif; font-size: 45px; font-weight: 700; letter-spacing: 8px; }
    </style>
  </defs>

  <!-- House roof and walls -->
  <path class="navy" d="M70 160 L225 45 L380 145 L380 330 L320 330 L320 174 L225 112 L130 181 L130 330 L70 330 Z"/>
  <!-- Person: head and body -->
  <circle class="red" cx="62" cy="190" r="43"/>
  <path class="red" d="M20 254 L82 222 L82 365 L20 365 Z"/>
  <!-- Window -->
  <rect class="navy" x="178" y="210" width="43" height="43" rx="4"/>
  <rect class="navy" x="238" y="210" width="43" height="43" rx="4"/>
  <rect class="navy" x="178" y="270" width="43" height="43" rx="4"/>
  <rect class="navy" x="238" y="270" width="43" height="43" rx="4"/>

  <!-- Wordmark -->
  <text class="navy wordmark" x="425" y="270">inprop</text>

  <!-- Tagline -->
  <text class="navy tagline" x="435" y="365">RENT</text>
  <circle class="red" cx="610" cy="349" r="10"/>
  <text class="navy tagline" x="655" y="365">BUY</text>
  <circle class="red" cx="820" cy="349" r="10"/>
  <text class="navy tagline" x="865" y="365">JOBS</text>
</svg>
