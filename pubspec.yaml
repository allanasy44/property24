name: property24_zimbabwe

description: Flutter frontend for the Property24 Zimbabwe rental platform.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  go_router: ^17.5.0
  http: ^1.2.2
  http_parser: ^4.0.2
  intl: ^0.20.3
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  sizer: ^3.0.5
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  google_sign_in_platform_interface: ^3.1.0
  google_sign_in_web: ^1.1.3
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  record: ^6.1.2
  web_socket_channel: ^3.0.1

  # Maps
  flutter_map: ^8.2.2
  latlong2: ^0.10.1
  flutter_webrtc: ^1.6.2+hotfix.3
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - web/favicon.svg
