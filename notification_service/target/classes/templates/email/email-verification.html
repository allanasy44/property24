<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/template :: layout(~{::section})}">
<section>
    <h1>Verify your email address</h1>
    <p th:text="|Hello ${firstName},|">Hello Customer,</p>
    <p>Please verify your email address to finish setting up your account.</p>
    <p><a class="button" th:href="${verificationUrl}">Verify email</a></p>
</section>
</body>
</html>
