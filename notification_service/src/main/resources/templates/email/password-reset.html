<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/template :: layout(~{::section})}">
<section>
    <h1>Reset your password</h1>
    <p th:text="|Hello ${firstName},|">Hello Customer,</p>
    <p>You requested a password reset. This link expires in <span th:text="${expiresInMinutes}">10</span> minutes.</p>
    <p><a class="button" th:href="${resetUrl}">Reset password</a></p>
</section>
</body>
</html>
