<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/template :: layout(~{::section})}">
<section>
    <h1>Your one-time password</h1>
    <p th:text="|Hello ${firstName},|">Hello Customer,</p>
    <p>Use the one-time password below to continue:</p>
    <p class="code" th:text="${otp}">384921</p>
    <p th:text="|This code expires in ${expiresInMinutes} minutes.|">This code expires in 10 minutes.</p>
    <p class="notice">Do not share this code with anyone. If you did not request it, please ignore this email.</p>
</section>
</body>
</html>
